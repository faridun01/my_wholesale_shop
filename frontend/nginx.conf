# Preserve the original client-facing scheme when this container sits behind
# another reverse proxy (Caddy) that already set X-Forwarded-Proto; only fall
# back to nginx's own $scheme when the header wasn't forwarded at all (i.e.
# nginx is the outermost hop, e.g. local/dev access).
map $http_x_forwarded_proto $proxy_x_forwarded_proto {
  default $http_x_forwarded_proto;
  '' $scheme;
}

map $proxy_x_forwarded_proto $staged_hsts {
  default "";
  https "max-age=300";
}

server {
  listen 80;
  server_name crm.itforce.pro 72.62.94.218;

  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  include /etc/nginx/security-headers.conf;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_types
    application/javascript
    application/json
    application/wasm
    image/svg+xml
    text/css
    text/javascript
    text/plain
    text/xml;

  # Serve the .gz files built alongside dist (see frontend/Dockerfile) instead of
  # re-compressing these immutable, content-hashed assets on every single request.
  # Falls back to on-the-fly `gzip` above for anything without a precompressed sibling.
  gzip_static on;

  location = /index.html {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
  }

  location /assets/ {
    include /etc/nginx/security-headers.conf;
    access_log off;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location = /favicon.ico {
    include /etc/nginx/security-headers.conf;
    access_log off;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000" always;
  }

  location / {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /index.html;
  }

  location /api/ {
    # Backend owns API headers, without duplicate inherited header fields.
    proxy_hide_header X-Content-Type-Options;
    add_header X-Content-Type-Options "nosniff" always;
    proxy_pass http://backend:3001/api/;
    proxy_http_version 1.1;
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
  }

  location /uploads/ {
    proxy_pass http://backend:3001/uploads/;
    proxy_http_version 1.1;
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    proxy_hide_header Cache-Control;
    # Authenticated images must not enter a shared/public cache.
    add_header Cache-Control "private, max-age=604800" always;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
  }
}
